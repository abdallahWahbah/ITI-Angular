<h1 class="text-3xl font-bold underline">
  Hello world!
</h1>
<!-- background color, text color -->
<h2 class="bg-orange-900/90">asd</h2> <!-- "/90" is opacity, range 0:100 -->
<h2 class="bg-red-500 text-blue-100">asdasdasd</h2>
<input type="radio" checked class="accent-red-900">
<input type="checkbox" checked class="accent-yellow-900">

<!-- 
    ----------- HEIGHT, WIDTH -----------
    range:::        >>> h-0 : 0-96
    percentage:::   >>> h-1/2, h-1/3... h-1/6    h-2/3..h-2/6   h3/4....
    full:::         >>> h-full
    min:::          >>> min-h-10
    /// the same for width
    width & height  >>> size-10
-->


<!-- arbitary value: to generate any value (between "[]") -->
<h2 class="bg-[#09c] text-[tomato] text-[50px] p-[10px] m-[10px] h-[160px] w-[200px]">arbitary value</h2>

<!-- background image -->
<div class="bg-center bg-cover  w-full h-[10px] " >sss</div> <!-- bg-[url('/images/car.jpeg')] -->

<!-- ----------------------- hover, transition ----------------------- -->
 <!-- hover the same element -->
<div class=" 
    hover:bg-red-500 
    hover:p-5 
    hover:text-blue-100 
    transition-all
    duration-[1s]
    w-full h-[20px]"
    >
    <!-- transition-[background-color_height]  --> <!-- transition for multiple elements -->
 ssssssssssssss
</div>

<!-- hover parent, change child -->
<div class="p-20 bg-red-500 
    group"> <!-- mark it with "group" class-->
    <div class="p-10 bg-sky-200 
        group-hover:bg-orange-100"></div> <!-- mark it with "group-hover" class-->
</div>

<!-- hover parent, change child ,,,,,, hover child, change grand child -->
<div class="bg-red-100 p-20 
    group/container">
    <div class="bg-sky-500 p-20 
        group-hover/container:bg-[orange] group/container_2">
        <div class="bg-orange-100 p-20
            group-hover/container_2:bg-[black]"></div>
    </div>
</div>

<!-- hover element, change sibling -->
<div class="bg-[red] p-20 
    peer/hambozo"></div>
<div class="bg-sky-500 p-20 
    peer-hover/hambozo:bg-[black]"></div>

<!-- ----------------------- focus, placeholder ----------------------- -->
<input type="text" placeholder="hello..." class="bg-red-500 
                                            focus:text-green-700 focus:bg-gray-200 focus:outline-none placeholder:text-red-900">


<!-- ----------------------- transform ----------------------- -->
<div class="bg-red-300  transition-all duration-[1s]
hover:rotate-180 hover:scale-x-100 "></div> <!--rotate :::: :180      scale ::: 0:150-->


<!-- ----------------------- directives: putting multiple classes into one class ----------------------- -->
<button class="btn__orange">Login</button> <!-- this class is coming from home.css file-->
<button class="btn__green">Register</button>
